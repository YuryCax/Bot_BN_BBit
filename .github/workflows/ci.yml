name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test --all

  python-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install collector deps
        run: pip install -r research/collector/requirements.txt
      - name: edge analysis synthetic (mid-only)
        run: python research/edge_report/analyze.py --synthetic --data-dir /tmp/edge_mid --output-profile /tmp/mid_profile.toml --output-summary /tmp/mid_summary.md
      - name: install quant deps
        run: pip install -r research/quant/requirements.txt
      - name: phase 0.5 quant hardening (synthetic L2)
        run: |
          python research/quant/download_hist.py --days 1 --output /tmp/hist --synthetic
          python research/quant/analyze_lead_lag.py --hist-dir /tmp/hist --notional-usd 1000 \
            --output-profile /tmp/edge_profile.toml \
            --output-summary /tmp/summary.md \
            --output-params /tmp/params.json \
            --symbols-toml config/symbols.toml
