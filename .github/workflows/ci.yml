name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace --all-targets
      - name: release build
        run: cargo build --release --workspace

  python-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install deps
        run: pip install -r research/collector/requirements.txt
      - name: edge analysis synthetic
        run: >-
          python research/edge_report/analyze.py --synthetic
          --data-dir "$RUNNER_TEMP/edge-data"
          --output-profile "$RUNNER_TEMP/edge-profile.toml"
          --output-summary "$RUNNER_TEMP/edge-summary.md"
